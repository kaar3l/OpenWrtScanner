<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canon LiDE 400</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%96%A8%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="page-header">
      <div class="page-header-text">
        <h1 data-i18n="title">Canon LiDE 400</h1>
      </div>
      <div class="lang-switch" role="group" aria-label="Language / Keel">
        <button type="button" class="lang-btn" data-lang="et">ET</button>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
      </div>
    </header>

    <section class="card">
      <form id="scan-form" class="scan-form">
        <label>
          <span data-i18n="labelResolution">Eraldusvõime</span>
          <select name="resolution" id="resolution">
            <option value="150" selected>150 dpi</option>
            <option value="300">300 dpi</option>
            <option value="600">600 dpi</option>
            <option value="1200">1200 dpi</option>
          </select>
        </label>

        <label>
          <span data-i18n="labelMode">Režiim</span>
          <select name="mode" id="mode">
            <option value="Color" data-i18n="modeColor" selected>Värviline</option>
            <option value="Grayscale" data-i18n="modeGrayscale">Mustvalge</option>
          </select>
        </label>

        <label>
          <span data-i18n="labelFormat">Formaat</span>
          <select name="format" id="format">
            <option value="PDF" selected>PDF</option>
            <option value="JPG">JPG</option>
          </select>
        </label>

        <button type="submit" id="scan-button" data-i18n="scanButton">Skanni</button>
      </form>
    </section>

    <section class="card">
      <h2 data-i18n="previewHeading">Eelvaade</h2>
      <p id="status" class="status"></p>
      <div id="progress-wrap" class="progress-wrap" hidden>
        <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
        <span id="progress-percent" class="progress-percent">0%</span>
        <button type="button" id="cancel-button" class="cancel-button" data-i18n="cancelButton">Katkesta</button>
      </div>
      <div id="preview" class="preview-pane">
        <p class="preview-placeholder" data-i18n="previewEmpty">Skaneeringut veel pole.</p>
      </div>
      <p id="download-area"></p>
    </section>

    <section class="card">
      <h2 data-i18n="historyHeading">Viimased skaneeringud</h2>
      <div id="history-grid" class="history-grid">
        <p class="history-empty" data-i18n="historyEmpty">Skaneeringuid veel pole.</p>
      </div>
    </section>
  </div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
